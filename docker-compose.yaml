services:
  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5082
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE:-UTC}
      - POSTGRES_HOST=todoapp-postgres
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5082:5082"
    restart: always
  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  todoapp-swagger:
    build:
      context: ${PROJECT_ROOT}
      # Dockerfile встроен в Compose, поскольку нужен только этому инструменту.
      dockerfile_inline: |
        # Alpine уменьшает размер образа; Go нужен для установки CLI swag.
        # Используем Go 1.25, чтобы инструмент мог работать с модулем проекта.
        FROM golang:1.25-alpine
        # Git нужен, если при загрузке Go-модулей потребуется доступ к репозиториям.
        # --no-cache не сохраняет индекс пакетов в образе.
        RUN apk add --no-cache git
        # Фиксируем версию генератора, чтобы она не менялась при каждой сборке.
        # go install помещает исполняемый файл в /go/bin, который уже есть в PATH.
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        # Отсюда swag будет читать исходники и записывать сгенерированные файлы.
        WORKDIR /code
        # Аргументы docker compose run передаются прямо в swag, например init.
        ENTRYPOINT ["swag"]
    # Подключаем исходники при запуске: генератор видит актуальный код,
    # а созданная документация сохраняется в проекте на хосте.
    volumes:
      - ${PROJECT_ROOT}:/code

  todoapp-postgres-migrations:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    depends_on:
      - todoapp-postgres
    command:
      - tcp-listen:5432,fork,reuseaddr
      - tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5433}:5432"
