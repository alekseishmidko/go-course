basePath: /api/v1
consumes:
- application/json
definitions:
  cmd_internal_features_statistics_transport_http.GetStatisticsResponse:
    properties:
      task_complete_average_time:
        example: 1h30m0s
        type: string
        x-nullable: true
      tasks_completed:
        type: integer
      tasks_completed_percent:
        example: 50
        type: number
        x-nullable: true
      tasks_created:
        type: integer
    type: object
  cmd_internal_features_tasks_transport_http.CreateTaskRequest:
    properties:
      author_user_id:
        example: 1
        type: integer
      description:
        example: Прочитать раздел о HTTP
        maxLength: 1000
        minLength: 1
        type: string
        x-nullable: true
      title:
        example: Изучить Go
        maxLength: 100
        minLength: 1
        type: string
    required:
    - author_user_id
    - title
    type: object
  cmd_internal_features_tasks_transport_http.CreateTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        format: date-time
        type: string
        x-nullable: true
      created_at:
        format: date-time
        type: string
      description:
        type: string
        x-nullable: true
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  cmd_internal_features_tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        format: date-time
        type: string
        x-nullable: true
      created_at:
        format: date-time
        type: string
      description:
        type: string
        x-nullable: true
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  cmd_internal_features_tasks_transport_http.PatchRequestDto:
    properties:
      completed:
        example: true
        type: boolean
      description:
        example: Прочитать раздел о HTTP
        maxLength: 1000
        minLength: 1
        type: string
      title:
        example: Изучить Go
        maxLength: 100
        minLength: 1
        type: string
    type: object
  cmd_internal_features_tasks_transport_http.PatchTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        format: date-time
        type: string
        x-nullable: true
      created_at:
        format: date-time
        type: string
      description:
        type: string
        x-nullable: true
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  cmd_internal_features_tasks_transport_http.TaskDtoResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        format: date-time
        type: string
        x-nullable: true
      created_at:
        format: date-time
        type: string
      description:
        type: string
        x-nullable: true
      id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  cmd_internal_features_users_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: Алексей Иванов
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        example: "+79997654321"
        maxLength: 15
        minLength: 10
        type: string
        x-nullable: true
    required:
