    type: object
  cmd_internal_features_users_transport_http.CreateUserResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      phone_number:
        type: string
        x-nullable: true
      version:
        type: integer
    type: object
  cmd_internal_features_users_transport_http.GetUserResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      phone_number:
        type: string
        x-nullable: true
