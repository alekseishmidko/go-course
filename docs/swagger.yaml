  cmd_internal_features_users_transport_http.PatchUserRequest:
    properties:
      full_name:
        example: Алексей Иванов
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        example: "+79997654321"
        maxLength: 15
        minLength: 10
        type: string
        x-nullable: true
    type: object
  cmd_internal_features_users_transport_http.PatchUserResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
