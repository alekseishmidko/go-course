host: localhost:5082
info:
  contact: {}
  description: |-
    REST API для управления пользователями и их задачами.
    Поддерживает создание, просмотр, обновление и удаление пользователей и задач, а также получение статистики выполнения задач.
  title: TodoApp API
  version: "1.0"
paths:
  /statistics:
    get:
      description: Фильтры применяются к created_at. Даты задают полночь UTC; обе
        границы включены, to должен быть позже from. Без задач счётчики равны 0, процент
        и среднее — null. Среднее считается по завершённым задачам и возвращается
        строкой длительности Go.
      parameters:
      - description: ID автора задач
        in: query
        name: userId
        type: integer
      - description: Начало периода (YYYY-MM-DD)
        example: "2026-10-01"
        format: date
        in: query
        name: from
        type: string
      - description: Конец периода (YYYY-MM-DD), полночь включительно
        example: "2026-11-01"
        format: date
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Получить статистику задач
      tags:
      - statistics
  /tasks:
    get:
      parameters:
      - description: Максимальное число записей
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Число пропускаемых записей
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: ID автора задач
        in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_internal_features_tasks_transport_http.TaskDtoResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Получить список задачу
      tags:
      - tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Поля новой записи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{taskId}:
    delete:
      parameters:
      - description: ID задачи
        in: path
        name: taskId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Запись удалена; тело ответа отсутствует
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить задачу
      tags:
      - tasks
    get:
      parameters:
      - description: ID задачи
        in: path
        name: taskId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Пустой объект допустим. null запрещён для title, description и
        completed. completed обновляет completed_at автоматически.
      parameters:
      - description: ID задачи
        in: path
        name: taskId
        required: true
        type: integer
      - description: Поля для обновления; непереданные поля сохраняются
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_internal_features_tasks_transport_http.PatchRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Обновить задачу
      tags:
      - tasks
  /users:
    get:
      parameters:
      - description: Максимальное число записей
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Число пропускаемых записей
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_internal_features_users_transport_http.UserDtoResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Получить список пользователя
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: Поля новой записи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_internal_features_users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_internal_features_users_transport_http.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Запись удалена; тело ответа отсутствует
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить пользователя
      tags:
      - users
    get:
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Получить пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: 'Пустой объект допустим. phone_number: null очищает телефон; full_name:
        null запрещён.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления; непереданные поля сохраняются
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alekseishmidko_go-course_cmd_internal_core_transport_http_response.ErrorResponse'
      summary: Обновить пользователя
      tags:
      - users
produces:
- application/json
schemes:
- http
swagger: "2.0"
tags:
- description: Управление пользователями.
  name: users
- description: Управление задачами пользователей и их состоянием выполнения.
  name: tasks
- description: Статистика задач с фильтрацией по автору и периоду создания.
  name: statistics
